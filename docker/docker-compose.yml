services:
  codexmanager-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      CODEXMANAGER_SERVICE_ADDR: 0.0.0.0:48760
      TZ: ${TZ:-Asia/Shanghai}
      CODEXMANAGER_DB_PATH: /data/codexmanager.db
      CODEXMANAGER_RPC_TOKEN_FILE: /data/codexmanager.rpc-token
      CODEXMANAGER_GATEWAY_TRACE_STDOUT: "0"
      CODEXMANAGER_GATEWAY_ERROR_STDOUT: "0"
    volumes:
      - codexmanager-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  codexmanager-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    init: true
    user: "10001:10001"
    depends_on:
      codexmanager-service:
        condition: service_healthy
    environment:
      CODEXMANAGER_WEB_ADDR: 0.0.0.0:48761
      CODEXMANAGER_WEB_NO_SPAWN_SERVICE: "1"
      CODEXMANAGER_SERVICE_ADDR: codexmanager-service:48760
      TZ: ${TZ:-Asia/Shanghai}
      CODEXMANAGER_DB_PATH: /data/codexmanager.db
      CODEXMANAGER_RPC_TOKEN_FILE: /data/codexmanager.rpc-token
      CODEXMANAGER_WEB_NO_OPEN: "1"
      CODEXMANAGER_WEB_ACCESS_PASSWORD_FILE: /run/secrets/codexmanager-web-access-password
      CODEXMANAGER_WEB_ACCESS_PASSWORD_RESET: ${CODEXMANAGER_WEB_ACCESS_PASSWORD_RESET:-0}
      CODEXMANAGER_GATEWAY_TRACE_STDOUT: "0"
      CODEXMANAGER_GATEWAY_ERROR_STDOUT: "0"
    volumes:
      - codexmanager-data:/data
    secrets:
      - source: codexmanager-web-access-password
        target: codexmanager-web-access-password
        mode: 0444
    ports:
      - "127.0.0.1:${CODEXMANAGER_WEB_PORT:-48761}:48761"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  codexmanager-data:

secrets:
  codexmanager-web-access-password:
    file: ${CODEXMANAGER_WEB_ACCESS_PASSWORD_FILE_HOST:?set CODEXMANAGER_WEB_ACCESS_PASSWORD_FILE_HOST to a private password file}
