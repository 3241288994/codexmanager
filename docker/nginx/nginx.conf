# Optional reverse-proxy template. It is not used by the default Compose files.
# Keep the safer loopback-only deployment unless you have a reviewed public
# exposure design. Replace every example domain and certificate path below.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Codex-compatible clients may send underscore headers for session state.
    underscores_in_headers on;
    ignore_invalid_headers off;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Tune these values to your expected traffic before public exposure.
    limit_req_zone $binary_remote_addr zone=codexmanager_api:10m rate=10r/s;

    upstream codexmanager_service {
        server 127.0.0.1:48760;
        keepalive 32;
    }

    upstream codexmanager_web {
        server 127.0.0.1:48761;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name console.example.com api.example.com;
        return 301 https://$host$request_uri;
    }

    # Administrative console. Protect this origin with the Web authentication
    # configured in CodexManager and an additional network access policy.
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name console.example.com;

        ssl_certificate /etc/letsencrypt/live/console.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
        client_max_body_size 16m;

        location / {
            proxy_pass http://codexmanager_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }

    # Client gateway only. This deliberately exposes /v1/ and nothing else on
    # the service process: /rpc, LabContext administration, and every unknown
    # route receive 404 rather than being forwarded.
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.example.com;

        ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
        client_max_body_size 64m;

        location ^~ /v1/ {
            limit_req zone=codexmanager_api burst=30 nodelay;
            proxy_pass http://codexmanager_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Preserve Codex session and turn-state headers without exposing
            # any management route.
            proxy_set_header conversation_id $http_conversation_id;
            proxy_set_header session_id $http_session_id;
            proxy_set_header x-client-request-id $http_x_client_request_id;
            proxy_set_header x-openai-subagent $http_x_openai_subagent;
            proxy_set_header x-codex-beta-features $http_x_codex_beta_features;
            proxy_set_header x-codex-turn-metadata $http_x_codex_turn_metadata;
            proxy_set_header x-codex-turn-state $http_x_codex_turn_state;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
        }

        location / {
            return 404;
        }
    }
}
