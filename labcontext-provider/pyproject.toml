[project]
name = "labcontext"
version = "0.8.0"
description = "A read-only MCP evidence gateway for private research projects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0,<3",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
labctx = "labcontext.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labcontext"]
